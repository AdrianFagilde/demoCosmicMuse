name: CI

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  schedule:
    - cron: '0 0 * * *'

env:
  FORCE_COLOR: 2
  # Placeholders, no secretos. `vite build` no ejecuta el codigo de los modulos,
  # asi que el `throw` de src/lib/supabase.js no se dispara durante el build: sin
  # estas variables CI pasaria en verde con un bundle que lleva `undefined` dentro
  # y revienta en el navegador al llamar createClient(). createClient() exige una
  # URL con forma (supabase-js valida /^https?:\/\//), de ahi el dominio.
  VITE_SUPABASE_URL: https://placeholder.supabase.co
  VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key

# Los pushes seguidos no encolan cuatro jobs de matriz sobre el mismo commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        platform: [ubuntu-latest, windows-latest]
        node-version: [20.x, 22.x]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # npm ci, no npm install: parte de package-lock.json en vez de resolver de
      # nuevo, asi que una dependencia transitiva no puede colarse sin que se
      # haya tocado ningun manifiesto.
      - name: Install npm dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Run build
        run: npm run build

      # El build no se basta a si mismo: comprueba que la variable llego al
      # bundle. Sin esto, unset() -> undefined pasaria el typecheck de Rollup
      # sin quejarse.
      - name: Assert Supabase config reached the bundle
        run: node scripts/assert-bundle-env.mjs

  # Aplica las migraciones en un Supabase local y comprueba invariantes del
  # esquema final (RLS, contrato de funciones, politicas). Sin esto, una
  # migracion rota solo se descubre al desplegar.
  supabase-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Apply migrations from scratch
        run: supabase db reset --local

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Verify final schema invariants
        run: |
          DB_URL=$(supabase status -o env | grep '^DB_URL=' | cut -d'"' -f2)
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/ci_verification.sql

      - name: Verify RLS behaviour with JWT context
        run: |
          DB_URL=$(supabase status -o env | grep '^DB_URL=' | cut -d'"' -f2)
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/rls_tests.sql
