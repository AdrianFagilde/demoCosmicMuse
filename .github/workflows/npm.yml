name: CI

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  schedule:
    - cron: '0 0 * * *'

env:
  FORCE_COLOR: 2
  # Placeholders, no secretos. `vite build` no ejecuta el codigo de los modulos,
  # asi que el `throw` de src/lib/supabase.js no se dispara durante el build: sin
  # estas variables CI pasaria en verde con un bundle que lleva `undefined` dentro
  # y revienta en el navegador al llamar createClient(). createClient() exige una
  # URL con forma (supabase-js valida /^https?:\/\//), de ahi el dominio.
  VITE_SUPABASE_URL: https://placeholder.supabase.co
  VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key

# Los pushes seguidos no encolan cuatro jobs de matriz sobre el mismo commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        platform: [ubuntu-latest, windows-latest]
        node-version: [20.x, 22.x]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # npm ci, no npm install: parte de package-lock.json en vez de resolver de
      # nuevo, asi que una dependencia transitiva no puede colarse sin que se
      # haya tocado ningun manifiesto.
      - name: Install npm dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

      # El build no se basta a si mismo: comprueba que la variable llego al
      # bundle. Sin esto, unset() -> undefined pasaria el typecheck de Rollup
      # sin quejarse.
      - name: Assert Supabase config reached the bundle
        run: node scripts/assert-bundle-env.mjs
