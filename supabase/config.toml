# Configuracion local de Supabase.
#
# Este archivo antes no existia, y sin el las migraciones quedaban atadas a un
# proyecto enlazado: `supabase db push` habria aplicado sobre PRODUCCION. Con
# el proyecto enlazado es explicito y no se puede pulsar por error.
#
#   supabase start                 # stack local (requiere Docker)
#   supabase db reset              # recrea la BD local y aplica 001..017
#   supabase db lint               # advisor de seguridad sobre la local
#
# NUNCA enlazar ni hacer push a produccion sin revisar el diff de migraciones.

project_id = "mi-dashboard-react"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# La PWA registra este service worker; el alcance debe ser la raiz.
[edge_runtime]
enabled = true
policy = "oneshot"
